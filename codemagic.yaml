# ─────────────────────────────────────────────────────────────────────────────
# Astuto — iOS build & TestFlight on Codemagic (no Mac).
#
# Signing strategy: because a distribution certificate's PRIVATE KEY only exists
# where the cert was first created, any pre-existing cert in the Apple account is
# unusable on this build machine ("Cannot save Signing Certificates without
# certificate private key"). So the build itself deletes existing distribution
# certificates via the App Store Connect API and mints a fresh one whose private
# key it generates and keeps — then creates the matching App Store profile.
# ─────────────────────────────────────────────────────────────────────────────
workflows:
  ios-testflight:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: chiaveapipercodemagic
    environment:
      vars:
        APP_STORE_APPLE_ID: 6806852300
        BUNDLE_ID: "com.astuto.app"
        # RevenueCat's public SDK keys. They identify the app and grant
        # nothing, which is why they ship inside the binary — unlike the
        # secret key (sk_), which is for a server and must never be here.
        # Declared once so an Android workflow can reuse them as they are.
        REVENUECAT_IOS_KEY: "appl_HWZZHYAnvPnnzHgAtscRyFDUhPs"
        REVENUECAT_ANDROID_KEY: "goog_YaeEfHnlTfzLXeDDjfmQcgCVpKl"
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Let the App ID grant Sign in with Apple
        script: |
          set -e
          # Runner.entitlements asking for Sign in with Apple is only half of
          # it: a profile will not sign a build that claims a capability the
          # App ID does not carry, and that fails the export rather than the
          # sign-in. So the App ID is brought up to date here, before any
          # profile is minted — and the App Store profiles that already exist
          # are dropped, because Apple marks them invalid when a capability
          # changes rather than updating them in place.
          BUNDLE_UUID=$(app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier --json 2>/dev/null \
            | jq -r 'if type=="array" then (.[0].id // empty) else (.id // empty) end' 2>/dev/null || true)
          if [ -z "$BUNDLE_UUID" ]; then
            echo "No App ID registered for $BUNDLE_ID yet — fetch-signing-files will create one."
          else
            echo "App ID $BUNDLE_ID is $BUNDLE_UUID"
            # Already enabled is the outcome we want, and the API reports that
            # as an error, so it must not stop the build.
            app-store-connect bundle-ids enable-capabilities "$BUNDLE_UUID" \
              --capability "Sign In with Apple" \
              || echo "  Sign in with Apple was already enabled, or could not be changed."
            app-store-connect bundle-ids profiles --bundle-ids "$BUNDLE_UUID" \
              --type IOS_APP_STORE --json 2>/dev/null \
              | jq -r 'if type=="array" then .[].id else .id end' 2>/dev/null \
              | while read -r pid; do
                  if [ -n "$pid" ]; then
                    echo "  dropping stale App Store profile $pid"
                    app-store-connect profiles delete "$pid" --ignore-not-found || true
                  fi
                done
          fi

      - name: Reset signing — create a certificate we own + App Store profile
        script: |
          set -e
          keychain initialize
          echo "Removing existing distribution certificates (we don't hold their private keys)..."
          for T in IOS_DISTRIBUTION DISTRIBUTION; do
            app-store-connect certificates list --type "$T" --json 2>/dev/null | jq -r '.[].id' 2>/dev/null || true
          done | sort -u | while read -r cid; do
            if [ -n "$cid" ]; then
              echo "  deleting certificate $cid"
              app-store-connect certificates delete "$cid" || true
            fi
          done
          echo "Generating our OWN private key, then the certificate + App Store profile..."
          # fetch-signing-files needs a private key to create the certificate — give it a fresh one.
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;

      - name: Build signed IPA (build number = latest TestFlight + 1)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          flutter build ipa --release \
            --build-number=$(($LATEST + 1)) \
            --dart-define=REVENUECAT_IOS_KEY=$REVENUECAT_IOS_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - lorenzo.ballestrazzi07@gmail.com
        notify:
          success: true
          failure: true
