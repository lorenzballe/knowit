# ─────────────────────────────────────────────────────────────────────────────
# Astute — iOS build & TestFlight on Codemagic (no Mac).
#
# Signing, two ways, and nothing to set up for the first.
#
# As it always ran: every distribution certificate in the account is revoked
# and a fresh one minted with a throwaway key. It needs nothing, but a
# certificate revoked after upload fails every build it signed that is still
# waiting for App Review (ITMS-90035), in any app of the account — that is how
# Improvy 1.16.0 (40) and 1.17.0 (49) were refused.
#
# With a kept key — CERTIFICATE_PRIVATE_KEY, group "signing", Secret — the
# certificate made from it is found and reused and nothing is revoked. Optional.
# ─────────────────────────────────────────────────────────────────────────────
workflows:
  ios-testflight:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: chiaveapipercodemagic
    environment:
      # CERTIFICATE_PRIVATE_KEY lives here. A variable set in the Codemagic UI
      # reaches a codemagic.yaml build only through a group imported by name.
      groups:
        - signing
      vars:
        APP_STORE_APPLE_ID: 6806852300
        BUNDLE_ID: "com.astuto.app"
        # The home-screen widget is its own bundle inside the app's, signed
        # with its own profile, and it shares the app's group so it can read
        # what the app writes down for it.
        WIDGET_BUNDLE_ID: "com.astuto.app.AstutWidget"
        APP_GROUP: "group.com.astuto.app"
        # RevenueCat's public SDK keys. They identify the app and grant
        # nothing, which is why they ship inside the binary — unlike the
        # secret key (sk_), which is for a server and must never be here.
        # Declared once so an Android workflow can reuse them as they are.
        REVENUECAT_IOS_KEY: "appl_HWZZHYAnvPnnzHgAtscRyFDUhPs"
        REVENUECAT_ANDROID_KEY: "goog_YaeEfHnlTfzLXeDDjfmQcgCVpKl"
        # Where PostHog's events go. The project key itself is deliberately
        # NOT declared here: Codemagic rejects an empty var ("ensure this
        # value has at least 1 characters"), and the only two ways to satisfy
        # it are both wrong — a real key committed to the repo, or a
        # placeholder that would have the app start PostHog against a project
        # that does not exist.
        #
        # So the key is set in Codemagic's own environment — POSTHOG_KEY in
        # the "signing" group above — or not at all. A build with no key is
        # not measured (see lib/analytics.dart), which is what this repo
        # gets, and turning measurement on stays a variable rather than a
        # code change.
        POSTHOG_HOST: "https://eu.i.posthog.com"
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Let the App IDs grant what the entitlements ask for
        script: |
          set -e
          # An entitlements file asking for a capability is only half of it:
          # a profile will not sign a build that claims a capability the App
          # ID does not carry, and that fails the export rather than the
          # feature. So both App IDs are brought up to date here, before any
          # profile is minted — Sign in with Apple and App Groups on the app,
          # App Groups on the widget — and the App Store profiles that already
          # exist are dropped, because Apple marks them invalid when a
          # capability changes rather than updating them in place.
          #
          # The group itself ($APP_GROUP) cannot be made from here: the App
          # Store Connect API turns the capability on but has no call that
          # registers a group or ticks it on an App ID. That is done once, by
          # hand, at developer.apple.com → Identifiers → App Groups (register
          # it), then on each of the two App IDs → App Groups → Configure →
          # tick it. Until then the widget's profile signs nothing.
          for ID in "$BUNDLE_ID" "$WIDGET_BUNDLE_ID"; do
            BUNDLE_UUID=$(app-store-connect bundle-ids list \
              --bundle-id-identifier "$ID" \
              --strict-match-identifier --json 2>/dev/null \
              | jq -r 'if type=="array" then (.[0].id // empty) else (.id // empty) end' 2>/dev/null || true)
            if [ -z "$BUNDLE_UUID" ]; then
              echo "No App ID registered for $ID yet — fetch-signing-files will create one."
              continue
            fi
            echo "App ID $ID is $BUNDLE_UUID"
            # Already enabled is the outcome we want, and the API reports that
            # as an error, so it must not stop the build.
            if [ "$ID" = "$BUNDLE_ID" ]; then
              app-store-connect bundle-ids enable-capabilities "$BUNDLE_UUID" \
                --capability "Sign In with Apple" \
                || echo "  Sign in with Apple was already enabled, or could not be changed."
            fi
            app-store-connect bundle-ids enable-capabilities "$BUNDLE_UUID" \
              --capability "App Groups" \
              || echo "  App Groups was already enabled, or could not be changed."
            app-store-connect bundle-ids profiles --bundle-ids "$BUNDLE_UUID" \
              --type IOS_APP_STORE --json 2>/dev/null \
              | jq -r 'if type=="array" then .[].id else .id end' 2>/dev/null \
              | while read -r pid; do
                  if [ -n "$pid" ]; then
                    echo "  dropping stale App Store profile $pid"
                    app-store-connect profiles delete "$pid" --ignore-not-found || true
                  fi
                done
          done

      - name: Signing — as before, or with the kept key when there is one
        script: |
          set -e
          keychain initialize
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Signing with the kept key; no certificate is revoked."
            KEY_ARG="--certificate-key=@env:CERTIFICATE_PRIVATE_KEY"
          else
            # A certificate's private key only exists where it was made, so
            # the ones already in the account cannot sign here: they are
            # revoked and a new one is minted with a key made on the spot.
            echo "No kept key: revoking the distribution certificates and minting one."
            for T in IOS_DISTRIBUTION DISTRIBUTION; do
              app-store-connect certificates list --type "$T" --json 2>/dev/null | jq -r '.[].id' 2>/dev/null || true
            done | sort -u | while read -r cid; do
              if [ -n "$cid" ]; then
                echo "  revoking certificate $cid"
                app-store-connect certificates delete "$cid" || true
              fi
            done
            openssl genrsa -out /tmp/cert_key.pem 2048
            KEY_ARG="--certificate-key=@file:/tmp/cert_key.pem"
          fi
          # The app's profile and the widget's, against the same certificate.
          # The widget's App ID is registered here if it does not exist yet.
          for B in "$BUNDLE_ID" "$WIDGET_BUNDLE_ID"; do
            app-store-connect fetch-signing-files "$B" \
              --type IOS_APP_STORE \
              "$KEY_ARG" \
              --create
          done
          keychain add-certificates
          xcode-project use-profiles

      - name: The widget's App Group, or the widget without it
        script: |
          set -e
          # The widget reads what the app writes into $APP_GROUP, and a profile
          # carries that group only once it is registered and ticked on both
          # App IDs at developer.apple.com, which the API cannot do. Until it
          # is, the build goes ahead without the group instead of failing at
          # signing: the app is the same, and the widget shows its fixed line
          # rather than the day's card. The first build after the group is
          # ticked picks it up by itself.
          carries() {
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              for p in "$dir"/*.mobileprovision; do
                [ -e "$p" ] || continue
                plist=$(mktemp)
                security cms -D -i "$p" > "$plist" 2>/dev/null || continue
                id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist" 2>/dev/null || true)
                case "$id" in
                  *".$1")
                    if grep -q "$APP_GROUP" "$plist"; then
                      echo yes
                      return
                    fi
                    ;;
                esac
              done
            done
            echo no
          }
          app=$(carries "$BUNDLE_ID")
          widget=$(carries "$WIDGET_BUNDLE_ID")
          echo "$APP_GROUP on the app's profile: $app, on the widget's: $widget"
          if [ "$app" = yes ] && [ "$widget" = yes ]; then
            echo "The widget shares the app's data."
          else
            echo "Building without $APP_GROUP: the widget shows its fixed line."
            echo "To give it the day's card: developer.apple.com → Identifiers → +"
            echo "→ App Groups → register $APP_GROUP; then on $BUNDLE_ID and"
            echo "$WIDGET_BUNDLE_ID, App Groups → Configure → tick it → Save."
            for f in ios/Runner/Runner.entitlements ios/AstutWidget/AstutWidget.entitlements; do
              /usr/libexec/PlistBuddy -c 'Delete :com.apple.security.application-groups' "$f" || true
            done
          fi

      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;

      - name: Build signed IPA (build number = latest TestFlight + 1)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          flutter build ipa --release \
            --build-number=$(($LATEST + 1)) \
            --dart-define=REVENUECAT_IOS_KEY=$REVENUECAT_IOS_KEY \
            --dart-define=POSTHOG_KEY=${POSTHOG_KEY:-} \
            --dart-define=POSTHOG_HOST=$POSTHOG_HOST \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - lorenzo.ballestrazzi07@gmail.com
        notify:
          success: true
          failure: true
