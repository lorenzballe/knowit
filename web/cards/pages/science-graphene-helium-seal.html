<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- slug: science-graphene-helium-seal -->
<!-- Look: a page from a printed science book on cream stock. A plain jar drawn in ink stands on a shelf, its mouth closed by a black graphene sheet with a honeycomb pattern. Flat orange helium atoms, a simple paper pressure dial.
     Interaction: hold the pump. Helium atoms pour in, speed up and hammer the graphene sheet, which bulges into a dome with elastic weight. The "helium out" counter stays at 0.
     Wow: at full pressure the dome kicks and wobbles, and a rubber stamp slams down: SEALED. Not one atom got through. -->
<title>The sheet nothing gets through</title>
<link rel="stylesheet" href="kit/fonts.css">
<link rel="stylesheet" href="kit/astute-card.css">
<script src="kit/vendor/gsap.min.js"></script>
<style>
#stage{display:flex;flex:1;min-height:0}
#pic{flex:1;min-width:0;width:100%;height:100%;display:block;touch-action:none;overflow:visible}
#ctl{display:flex;align-items:center;gap:3.5cqw}
#ctl .say{flex:1;min-width:0;margin:0}
#pump{flex:none;background:none;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transform:rotate(-2.5deg)}
#pump span{display:block;font:800 max(2cqh,13px)/1.1 var(--body);color:#fff7ea;background:#b8321b;border-radius:1cqh;padding:1.7cqh 4.6cqw 1.9cqh;white-space:nowrap}
#pump span small{display:block;font:600 max(1.5cqh,12px)/1.2 var(--body);opacity:.85}
.say b{color:inherit}
</style>
<article class="card" id="card" data-topic="science" data-kind="Hold to pump · gas against a sheet">
  <div class="in">
    <div class="label"><svg></svg><span class="t"></span><span class="tag">HOLD TO PUMP</span></div>
    <h2 class="q">What is the most impermeable material known?</h2>
    <div class="stagebox" id="stage">
      <svg id="pic" role="img" aria-label="A paper jar full of helium atoms, sealed on top by a one-atom-thick sheet of graphene. A counter shows how much helium got out."></svg>
    </div>
    <div id="ctl">
      <button id="pump" aria-label="Hold to pump helium"><span>Hold to pump<small>helium in</small></span></button>
      <p class="say" id="say">The lid is a sheet of <b>graphene</b>. <b>Hold the pump</b> and push helium against it.</p>
    </div>
    <div class="keep gone" id="keep"><b>WHAT TO KEEP</b>Graphene lets no gas through, not even helium: the most impermeable material known.</div>
    <div class="foot"><span class="src">Source · Geopop, “GRAFENE: il materiale del futuro” (YouTube, 2019)</span></div>
  </div>
</article>
<script src="kit/astute-card.js"></script>
<script>
(() => {
  const svg = Kit.$('pic'), btn = Kit.$('pump'), say = Kit.$('say');
  const INK = '#10100c', ORANGE = '#b8321b', RED = '#b8321b';
  const TINT = 'color-mix(in srgb, var(--k) 8%, var(--c))';
  const PIPE = 'color-mix(in srgb, var(--k) 45%, var(--c))';
  const S = {p: 0, bulge: 0, pumping: false, done: false, boil: 1, touched: false};
  let W, H, fs, x0, x1, sy, y1, t, maxB, ar, pipeY;
  let G = {}, atoms = [], built = false, started = false, entered = false;
  let lastFx = 0, lastB = 0, spawnT = 0, needleTo = null;
  const bulgeTo = gsap.quickTo(S, 'bulge', {duration: .9, ease: 'elastic.out(1,.35)'});

  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let q = Math.imul(seed ^ seed >>> 15, 1 | seed); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; };
  const mk = (tag, a, p) => Kit.mk(tag, a, p);
  const txt = (p, x, y, s, a) => { const e = mk('text', Object.assign({x, y, fill: INK}, a), p); e.textContent = s; return e; };

  // A slightly hand-drawn edge: small fixed wobbles along each segment.
  function jag(pts, amp, seed, closed) {
    const r = rng(seed), out = [], n = pts.length, lim = closed ? n : n - 1;
    for (let i = 0; i < lim; i++) {
      const a = pts[i], b = pts[(i + 1) % n], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
      const segs = Math.max(1, Math.round(len / (fs * 1.6)));
      for (let s = 0; s < segs; s++) {
        const u = s / segs, j = (r() - .5) * 2 * amp * (s === 0 ? .25 : 1);
        out.push([a[0] + dx * u - dy / len * j, a[1] + dy * u + dx / len * j]);
      }
    }
    if (!closed) out.push(pts[n - 1]);
    return out;
  }
  const dOf = (pts, close) => 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L') + (close ? 'Z' : '');
  const top = x => { const u = (x - x0) / (x1 - x0); return (u <= 0 || u >= 1) ? sy : sy - S.bulge * Math.sin(Math.PI * u); };
  const bb = el => { try { return el.getBBox(); } catch (_) { return null; } };

  function layout() {
    svg.innerHTML = '';
    const f = Kit.fitSvg(svg); W = f.W; H = f.H;
    fs = Math.max(12, Math.min(15, (f.f || 13)));
    x0 = W * .08; x1 = W * .67; sy = H * .44; y1 = H * .95;
    t = Math.max(15, H * .052);
    maxB = Math.min(H * .2, (x1 - x0) * .36);
    ar = Math.max(5, Math.min(W, H) * .022);
    pipeY = y1 - (y1 - sy) * .22;
    const lw = Math.max(2.5, fs * .2);

    G.back = mk('g', {}, svg);
    G.jarWrap = mk('g', {}, svg);
    G.sheetWrap = mk('g', {}, svg);
    G.fx = mk('g', {}, svg);
    G.ui = mk('g', {}, svg);

    // The shelf the jar stands on.
    mk('path', {d: `M${x0 - fs * 1.6},${y1 + lw * .5} L${x1 + fs * 1.6},${y1 + lw * .5}`, stroke: INK, 'stroke-width': lw, 'stroke-linecap': 'round', fill: 'none'}, G.back);

    // The jar, its top following the sheet.
    G.jar = mk('path', {style: `fill:${TINT}`, stroke: INK, 'stroke-width': lw, 'stroke-linejoin': 'round'}, G.jarWrap);
    // The pump pipe coming in from the left, through the wall.
    mk('rect', {x: -4, y: pipeY - ar * 1.1, width: x0 + ar * .8 + 4, height: ar * 2.2, style: `fill:${PIPE}`, stroke: INK, 'stroke-width': 1.5}, G.jarWrap);
    G.pipeMouth = mk('ellipse', {cx: x0 + ar * .8, cy: pipeY, rx: ar * .5, ry: ar * 1.1, fill: INK}, G.jarWrap);
    // The key to the dots, written on the jar.
    const lx = x0 + (x1 - x0) * .14, ly = y1 - fs * 2.7;
    mk('circle', {cx: lx + fs * .9, cy: ly + fs * .95, r: ar, fill: ORANGE, stroke: INK, 'stroke-width': Math.max(1, ar * .15)}, G.jarWrap);
    const key = txt(G.jarWrap, lx + fs * 1.75, ly + fs * 1.33, '= a helium atom', {style: 'font:600 ' + fs + 'px var(--body)'});
    // The key stays readable at any size: the atoms bounce off it (down to the jar's floor) as off a wall.
    const kb = bb(key);
    G.key = {x0: lx + fs * .9 - ar - 2, y0: Math.min(ly + fs * .95 - ar, kb ? kb.y : ly) - 2, x1: (kb && kb.width ? kb.x + kb.width : lx + fs * 9) + 2};
    G.atoms = mk('g', {}, G.jarWrap);

    // The graphene sheet: a black band with its honeycomb, resting on the jar's rim.
    G.sheet = mk('path', {fill: INK}, G.sheetWrap);
    G.comb = mk('path', {fill: 'none', style: 'stroke:var(--c)', 'stroke-width': Math.max(1, t * .07), 'stroke-linejoin': 'round', opacity: .6}, G.sheetWrap);

    // Readouts: the label, then the big counter measured to sit clearly below it.
    const cx0 = W * .05;
    const lab = txt(G.ui, cx0, fs * 1.4, 'Helium out', {style: `font:700 ${fs}px var(--body)`});
    const zs = fs * 2.5;
    G.zero = txt(G.ui, cx0 + 1, 0, '0', {style: `font:700 ${zs}px var(--display)`});
    const lb = bb(lab), zb = bb(G.zero);
    const lBottom = lb ? lb.y + lb.height : fs * 1.75;
    const zTop = zb && zb.height ? zb.y : -zs * 1.1;
    const zy = lBottom + fs * .45 - zTop;
    G.zero.setAttribute('y', zy.toFixed(1));
    G.zeroBox = {x: cx0, y: lBottom + fs * .45, h: zb && zb.height ? zb.height : zs * 1.3};
    txt(G.ui, cx0 + zs * .75, zy - zs * .12, 'atoms', {style: `font:600 ${fs}px var(--body)`, opacity: .7});

    // Sheet labels: second line measured to sit clearly below the first.
    const tx = x1 + W * .075;
    const gl = txt(G.ui, tx, sy + fs * .1, 'graphene', {style: `font:700 ${fs}px var(--body)`});
    const tl = txt(G.ui, tx, 0, '1 atom thick', {style: `font:600 ${fs}px var(--body)`, opacity: .7});
    const gb = bb(gl), tb = bb(tl);
    const gBottom = gb && gb.height ? gb.y + gb.height : sy + fs * .45;
    const tTop = tb && tb.height ? tb.y : -fs * 1.0;
    tl.setAttribute('y', (gBottom + fs * .3 - tTop).toFixed(1));
    mk('path', {d: `M${tx - 3},${sy - fs * .35} Q${(tx + x1) / 2},${sy - fs * 1.3} ${x1 + 4},${sy - t * .4}`, fill: 'none', stroke: INK, 'stroke-width': 1.4, 'stroke-linecap': 'round'}, G.ui);

    // Pressure gauge: a plain paper dial.
    const gcx = (x1 + W) / 2 + W * .03, gcy = H * .76, R = Math.min(W * .12, H * .11);
    mk('path', {d: `M${gcx - R},${gcy} A${R},${R} 0 0 1 ${gcx + R},${gcy} Z`, style: `fill:${TINT}`, stroke: INK, 'stroke-width': lw * .8, 'stroke-linejoin': 'round'}, G.ui);
    mk('path', {d: `M${gcx + R * .76 * Math.cos(Math.PI * 1.7)},${gcy + R * .76 * Math.sin(Math.PI * 1.7)} A${R * .76},${R * .76} 0 0 1 ${gcx + R * .76},${gcy}`, fill: 'none', stroke: RED, 'stroke-width': R * .16}, G.ui);
    for (let i = 0; i <= 4; i++) { const a = Math.PI + Math.PI * i / 4; mk('line', {x1: gcx + Math.cos(a) * R * .5, y1: gcy + Math.sin(a) * R * .5, x2: gcx + Math.cos(a) * R * .64, y2: gcy + Math.sin(a) * R * .64, stroke: INK, 'stroke-width': 1.5, 'stroke-linecap': 'round'}, G.ui); }
    G.needle = mk('path', {d: `M${gcx - R * .07},${gcy} L${gcx},${gcy - R * .88} L${gcx + R * .07},${gcy} Z`, fill: INK}, G.ui);
    mk('circle', {cx: gcx, cy: gcy, r: R * .11, fill: INK}, G.ui);
    txt(G.ui, gcx, gcy + fs * 1.6, 'Pressure', {'text-anchor': 'middle', style: `font:700 ${fs}px var(--body)`});
    gsap.set(G.needle, {svgOrigin: `${gcx} ${gcy}`, rotation: -90 + 180 * (S.done ? 1 : S.p)});
    needleTo = gsap.quickTo(G.needle, 'rotation', {duration: .7, ease: 'elastic.out(1,.4)'});

    // The rubber stamp, hidden until the end, clear of the counter.
    const skyR = x1 + W * .03, stW = fs * 7.2;
    const stx = Math.max(cx0 + fs * 8 + stW / 2, Math.min(W * .5, skyR - stW / 2 - 4));
    // ...and clear of the dome at its full bulge, however short the drawing: raised (never out of the top) when the dome comes up close.
    const u = x => Math.max(0, Math.min(1, (x - x0) / (x1 - x0))), ua = u(stx - stW / 2), ub = u(stx + stW / 2);
    const domeTop = sy - maxB * (ua <= .5 && ub >= .5 ? 1 : Math.max(Math.sin(Math.PI * ua), Math.sin(Math.PI * ub))) - t / 2;
    const sty = Math.max(fs * 1.65 + 2, Math.min(fs * 2.6, domeTop - fs * 1.95));
    G.stamp = mk('g', {opacity: S.done ? 1 : 0}, G.ui);
    mk('rect', {x: stx - stW / 2, y: sty - fs * 1.15, width: stW, height: fs * 2.3, rx: fs * .25, style: 'fill:var(--c)', stroke: RED, 'stroke-width': Math.max(2.2, fs * .2)}, G.stamp);
    txt(G.stamp, stx, sty + fs * .55, 'SEALED', {'text-anchor': 'middle', fill: RED, style: `font:900 ${fs * 1.55}px var(--display)`, 'letter-spacing': '.04em'});
    gsap.set(G.stamp, {svgOrigin: `${stx} ${sty}`, rotation: -8});

    // Atoms: keep however many there were.
    const n = Math.max(atoms.length, 9), r = rng(5);
    atoms = [];
    gsap.killTweensOf(S);
    S.bulge = maxB * (S.done ? 1 : S.p);
    for (let i = 0; i < n; i++) addAtom(x0 + ar * 2 + r() * (x1 - x0 - ar * 4), sy + t + ar + r() * (y1 - sy - t - ar * 3), r);
    built = true; draw();
    if (!started) { started = true; requestAnimationFrame(tick); }
  }

  function addAtom(x, y, r, vx, vy) {
    const a = r() * Math.PI * 2, g = mk('g', {}, G.atoms);
    mk('circle', {r: ar, fill: ORANGE, stroke: INK, 'stroke-width': Math.max(1, ar * .15)}, g);
    const at = {x, y, vx: vx ?? Math.cos(a), vy: vy ?? Math.sin(a), g};
    atoms.push(at); return at;
  }
  const rs = rng(77);
  function spawn() {
    const at = addAtom(x0 + ar * 1.6, pipeY, rs, .9, (rs() - .5) * .9);
    if (!Kit.calm) gsap.from(at.g, {scale: 0, duration: .35, ease: 'back.out(3)'});
    if (!Kit.calm) gsap.fromTo(G.pipeMouth, {attr: {rx: ar * .9}}, {attr: {rx: ar * .5}, duration: .3, ease: 'elastic.out(1,.4)'});
  }

  // Where an atom bumps the sheet: a small flat knock mark.
  function hit(x, y) {
    const now = performance.now(); if (Kit.calm || now - lastFx < 65) return; lastFx = now;
    const pts = []; for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, rr = i % 2 ? ar * .45 : ar * 1.15; pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
    const s = mk('path', {d: dOf(pts, true), style: `fill:color-mix(in srgb, ${ORANGE} 45%, var(--c))`}, G.fx);
    gsap.timeline({onComplete: () => s.remove()})
      .fromTo(s, {scale: .2, transformOrigin: `${x}px ${y}px`}, {scale: 1, duration: .16, ease: 'back.out(3)'})
      .to(s, {opacity: 0, scale: .6, duration: .22, ease: 'power2.in'});
  }

  function move(dt) {
    const sp = (55 + 170 * S.p) * Math.max(.7, H / 420);
    for (const a of atoms) {
      a.x += a.vx * sp * dt; a.y += a.vy * sp * dt;
      if (a.x < x0 + ar + 3) { a.x = x0 + ar + 3; a.vx = Math.abs(a.vx); }
      if (a.x > x1 - ar - 3) { a.x = x1 - ar - 3; a.vx = -Math.abs(a.vx); }
      if (a.y > y1 - ar - 3) { a.y = y1 - ar - 3; a.vy = -Math.abs(a.vy); }
      const k = G.key;
      if (k && a.x > k.x0 - ar && a.x < k.x1 + ar && a.y > k.y0 - ar) {
        const up = a.y - (k.y0 - ar), lf = a.x - (k.x0 - ar), rt = k.x1 + ar - a.x, m = Math.min(up, lf, rt);
        if (m === up) { a.y = k.y0 - ar; a.vy = -Math.abs(a.vy); }
        else if (m === lf) { a.x = k.x0 - ar; a.vx = -Math.abs(a.vx); }
        else { a.x = k.x1 + ar; a.vx = Math.abs(a.vx); }
      }
      const ty = top(a.x) + t / 2 + ar;
      if (a.y < ty) { a.y = ty; a.vy = Math.abs(a.vy) + .1; hit(a.x, ty - ar); }
      const m = Math.hypot(a.vx, a.vy); a.vx /= m; a.vy /= m;
      a.g.setAttribute('transform', `translate(${a.x.toFixed(1)},${a.y.toFixed(1)})`);
    }
  }

  function draw() {
    if (!built) return;
    // Jar: smooth top under the sheet, gently hand-drawn walls.
    const N = 32, topPts = [];
    for (let i = 0; i <= N; i++) { const x = x0 + (x1 - x0) * i / N; topPts.push([x, top(x) + t * .3]); }
    const side = jag([[x1, sy + t * .3], [x1, y1], [x0, y1], [x0, sy + t * .3]], 1.2, 61, false);
    G.jar.setAttribute('d', dOf(topPts.concat(side), true));
    // Sheet band.
    const ov = fs * .7, up = [], dn = [];
    for (let i = 0; i <= 40; i++) { const x = x0 - ov + (x1 - x0 + ov * 2) * i / 40, y = top(x); up.push([x, y - t / 2]); dn.unshift([x, y + t / 2]); }
    G.sheet.setAttribute('d', dOf(up.concat(dn), true));
    // Honeycomb riding the curve.
    const hr = t / 3.6, dx = Math.sqrt(3) * hr; let d = '';
    for (const [row, off] of [[0, -hr * .75], [1, hr * .75]]) {
      for (let cx = x0 - ov + hr + (row ? dx / 2 : 0); cx < x1 + ov - hr * .8; cx += dx) {
        const cy = top(cx), sl = (top(cx + 1) - top(cx - 1)) / 2, ang = Math.atan(sl), ca = Math.cos(ang), sa = Math.sin(ang);
        const px = cx - sa * off, py = cy + ca * off;
        for (let k = 0; k < 6; k++) {
          const a = Math.PI / 6 + k * Math.PI / 3, vx = Math.cos(a) * hr, vy = Math.sin(a) * hr;
          const X = px + vx * ca - vy * sa, Y = py + vx * sa + vy * ca;
          d += (k ? 'L' : 'M') + X.toFixed(1) + ',' + Y.toFixed(1);
        }
        d += 'Z';
      }
    }
    G.comb.setAttribute('d', d);
  }

  let last = 0;
  function tick(now) {
    const dt = Math.min(.05, last ? (now - last) / 1000 : .016); last = now;
    if (built) {
      if (S.pumping && !S.done) {
        S.p = Math.min(1, S.p + dt / 2.8);
        spawnT -= dt; if (spawnT <= 0 && atoms.length < 50) { spawn(); spawnT = .075; }
        if (now - lastB > 110) { lastB = now; bulgeTo(maxB * S.p); needleTo(-90 + 180 * S.p); }
        if (S.p > .35 && say.dataset.s !== 'mid') { say.dataset.s = 'mid'; say.innerHTML = 'The sheet bulges like a balloon. <b>Keep pushing</b> and watch “helium out”.'; }
        if (S.p >= 1) finish();
      }
      move(dt); draw();
    }
    requestAnimationFrame(tick);
  }

  function press(e) {
    if (S.done) return;
    if (e) { e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (_) {} }
    S.pumping = true; S.touched = true; Kit.haptic('light');
    gsap.to(btn, {scale: .9, rotation: -4, duration: .18, ease: 'back.out(3)'});
  }
  function release() {
    if (!S.pumping) return;
    S.pumping = false;
    gsap.to(btn, {scale: 1, rotation: -2.5, duration: .6, ease: 'elastic.out(1,.35)'});
    if (!S.done) { bulgeTo(maxB * S.p); needleTo(-90 + 180 * S.p); say.dataset.s = 'rest'; say.innerHTML = 'You let go, and the dome stays up: nothing leaks out. <b>Hold again</b> to push harder.'; }
  }
  btn.addEventListener('pointerdown', press);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, release));
  btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); } });
  btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') release(); });

  function finish() {
    if (S.done) return;
    S.done = true; S.pumping = false; S.p = 1;
    Kit.haptic('success');
    needleTo && needleTo(90);
    gsap.killTweensOf(S);
    gsap.to(btn, {scale: 0, opacity: 0, duration: .35, ease: 'back.in(2)', onComplete: () => { btn.style.display = 'none'; }});
    say.innerHTML = 'You pushed helium until the sheet ballooned, and <b>not one atom got out</b>. Graphene, a honeycomb of carbon one atom thick, is the most impermeable material known: no gas passes, not even helium.';
    Kit.show('keep');
    if (Kit.calm) { S.bulge = maxB; gsap.set(G.stamp, {opacity: 1, scale: 1}); return; }
    gsap.fromTo(S, {bulge: maxB * 1.22}, {bulge: maxB, duration: 1.8, ease: 'elastic.out(1.2,.22)'});
    gsap.fromTo(G.stamp, {opacity: 0, scale: 2.6, rotation: -24}, {opacity: 1, scale: 1, rotation: -8, duration: .5, delay: .25, ease: 'back.out(2.4)'});
    gsap.fromTo(G.zero, {rotation: -14, transformOrigin: '50% 80%'}, {rotation: 0, duration: 1, delay: .3, ease: 'elastic.out(1,.3)'});
    gsap.from(say, {opacity: 0, y: 8, duration: .5, ease: 'power3.out'});
  }

  Kit.onShow.card = layout;
  Kit.onEnter.card = () => {
    if (entered || !built || Kit.calm) return; entered = true;
    gsap.from(G.back.children, {opacity: 0, scale: .8, rotation: () => (Math.random() - .5) * 14, transformOrigin: '50% 50%', duration: .7, stagger: .06, ease: 'back.out(1.6)'});
    gsap.from(G.jarWrap, {y: H * .45, opacity: 0, duration: .8, delay: .1, ease: 'back.out(1.5)'});
    gsap.from(G.sheetWrap, {y: -H * .5, rotation: -6, transformOrigin: '50% 50%', duration: 1.1, delay: .35, ease: 'elastic.out(1,.5)'});
    gsap.from(G.ui.children, {opacity: 0, duration: .5, delay: .5, stagger: .03, ease: 'power2.out'});
    gsap.from(btn, {scale: 0, rotation: 20, duration: .7, delay: .7, ease: 'elastic.out(1,.45)'});
  };
  Kit.play.card = async () => {
    const w = ms => new Promise(r => setTimeout(r, ms));
    press(); await w(Kit.calm ? 80 : 400);
    S.p = Math.max(S.p, .99); await w(Kit.calm ? 80 : 200);
    release(); if (!S.done) finish();
    await w(Kit.calm ? 100 : 900);
  };
})();
// Drawn again at the size it now has when the answer takes room from it: never shrunk whole into a corner.
// Left too little room to draw again (a small phone), it keeps the drawing it has, shown smaller, whole.
