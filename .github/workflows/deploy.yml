name: Deploy the site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The bank's own gate, and both copies of it current: a card edited by
      # hand and not bundled would ship one thing to the phone and another
      # to the site.
      - run: |
          pip install -q -r tool/cards/requirements.txt
          python3 tool/cards/check.py
          python3 tool/cards/bundle.py --check
          python3 -m unittest discover -s tool/cards -p "test_*.py"
          python3 tool/site/chrome.py --check

      - run: flutter test

      # No service worker on the preview. Its whole job is to serve the
      # last build from cache, which on a page whose point is seeing the
      # newest one means a hard refresh after every deploy — and forgetting
      # to do it looks exactly like a change that did not land.
      # The preview is measured only if a POSTHOG_KEY repository variable is
      # set. Unset — which is what a fork gets — the key is empty and the
      # build is not measured at all, rather than measured into nowhere. A
      # variable and not a secret: the key is public, it ships inside the
      # bundle either way, and a secret would only be masked in the log.
      # The app itself, playable in a browser, under /app/ — the root of
      # the domain is the site's own page.
      - run: |
          flutter build web --release \
            --base-href /app/ \
            --pwa-strategy=none \
            --dart-define=POSTHOG_KEY=${{ vars.POSTHOG_KEY }} \
            --dart-define=POSTHOG_HOST=${{ vars.POSTHOG_HOST || 'https://eu.i.posthog.com' }}


      # Stamp the bundle with the commit. Removing the service worker stopped
      # it serving yesterday's build, but the plain HTTP cache still can:
      # main.dart.js is requested at the same URL every deploy, so a browser
      # holding it has no reason to ask again, and a change that shipped an
      # hour ago looks like a change that never landed. A new URL each build
      # takes that away — there is nothing to guess and nothing to clear.
      - name: Version the bundle so a deploy cannot be served from cache
        run: |
          v="${GITHUB_SHA::12}"
          sed -i "s|flutter_bootstrap.js\"|flutter_bootstrap.js?v=$v\"|g" build/web/index.html
          sed -i "s|\"main\.dart\.js\"|\"main.dart.js?v=$v\"|g" build/web/flutter_bootstrap.js
          grep -o 'flutter_bootstrap.js?v=[0-9a-f]*' build/web/index.html | head -1
          grep -o 'main.dart.js?v=[0-9a-f]*' build/web/flutter_bootstrap.js | head -1

      # astutetheapp.com, put together: the site's pages at the root (site/),
      # the app under /app/, and at the paths the app itself reads — the
      # card bank at /cards/cards.json, the widget's days at
      # /widget/days.json, the privacy policy at /privacy.html — so a phone
      # already out there finds everything where it always has, through
      # lorenzballe.github.io/knowit/ as much as through the domain.
      - name: Put the site together
        run: |
          rm -rf _site
          mkdir -p _site/app _site/widget
          cp -r build/web/. _site/app/
          cp -r site/. _site/
          cp -r web/cards _site/cards
          ls -la _site

      # The question of the day for the next two months, where the iPhone
      # widget looks when the app has not handed it anything yet.
      - name: Publish the widget's days
        run: WIDGET_DAYS_OUT=_site/widget/days.json flutter test tool/widget_days.dart

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
