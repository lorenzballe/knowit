name: Domain check

# Asks the world's DNS what astutetheapp.com points at, and what answers
# there — the check a phone cannot run and the development sandbox is not
# allowed to. Run it by hand from the Actions tab, or change this file.
#
# Started by hand, it keeps asking until the site answers over HTTPS, for up
# to the minutes given (170 unless told otherwise; a push just looks once),
# one step per stage, so whoever watches the run can tell how far it has
# got: the records at Cloudflare itself, then the world's DNS (which may
# remember an empty answer for half an hour), then GitHub's certificate.
# The last step lists what every page answers and what is left to do.

on:
  workflow_dispatch:
    inputs:
      wait:
        description: "Minutes to wait for the domain to come up (0 = just look)"
        default: "170"
  push:
    branches: [main]
    paths:
      - ".github/workflows/domain-check.yml"

env:
  DOMAIN: astutetheapp.com
  WAIT: ${{ github.event_name == 'push' && '0' || inputs.wait }}
  # GitHub Pages' own four addresses, and the name www should point at.
  PAGES: "185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153"
  CNAME: lorenzballe.github.io

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: What the DNS says
        run: |
          sudo apt-get install -y -qq whois dnsutils >/dev/null 2>&1 || true
          case "$WAIT" in ''|*[!0-9]*) WAIT=0 ;; esac
          [ "$WAIT" -le 170 ] || WAIT=170
          echo "DEADLINE=$(( $(date +%s) + WAIT * 60 ))" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/lib.sh" <<'EOF'
          # Every address in "$1" is one of GitHub Pages' own, and there is one.
          pages_only() {
            [ -n "$1" ] || return 1
            for ip in $1; do
              case " $PAGES " in *" $ip "*) ;; *) return 1 ;; esac
            done
          }
          # The addresses a server gives for a name, sorted, on one line.
          addresses() { dig +short A "$1" @"$2" | grep -E '^[0-9.]+$' | sort | tr '\n' ' ' | sed 's/ $//'; }
          late() { [ "$(date +%s)" -ge "$DEADLINE" ]; }
          now() { date -u +%H:%M:%S; }
          EOF
          for name in "$DOMAIN" "www.$DOMAIN"; do
            echo "== $name"
            for type in NS SOA A AAAA CNAME; do
              echo "-- $type via Google: $(dig +short @8.8.8.8 "$name" "$type" | tr '\n' ' ')"
              echo "-- $type via Cloudflare: $(dig +short @1.1.1.1 "$name" "$type" | tr '\n' ' ')"
            done
          done
          echo "== The registry"
          whois "$DOMAIN" | grep -i -E "registrar:|name server|creation date|domain status" | head -20 || true

      # Straight from the domain's own name server, past every cache: the
      # moment a record is saved at Cloudflare, it shows here.
      - name: The records at Cloudflare
        run: |
          . "$RUNNER_TEMP/lib.sh"
          ns=$(dig +short NS "$DOMAIN" @1.1.1.1 | head -1)
          ns=${ns:-braelyn.ns.cloudflare.com.}
          echo "Asking $ns"
          last=""
          while :; do
            a=$(addresses "$DOMAIN" "$ns")
            www=$(dig +short CNAME "www.$DOMAIN" @"$ns" | tr 'A-Z' 'a-z' | tr '\n' ' ' | sed 's/ $//')
            wwwa=$(addresses "www.$DOMAIN" "$ns")
            said="A: ${a:-none} · www: ${www:-${wwwa:-none}}"
            [ "$said" = "$last" ] || { echo "$(now)  $said"; last=$said; }
            if pages_only "$a" && [ "$www" = "$CNAME." ]; then echo "RECORDS=ok" >> "$GITHUB_ENV"; exit 0; fi
            if late; then echo "The records do not point at GitHub Pages yet."; exit 1; fi
            sleep 20
          done

      - name: The world's DNS
        if: always()
        run: |
          . "$RUNNER_TEMP/lib.sh"
          [ "$RECORDS" = ok ] || { echo "Skipped: the records are not there."; exit 1; }
          last=""
          while :; do
            g=$(addresses "$DOMAIN" 8.8.8.8)
            c=$(addresses "$DOMAIN" 1.1.1.1)
            gw=$(addresses "www.$DOMAIN" 8.8.8.8)
            cw=$(addresses "www.$DOMAIN" 1.1.1.1)
            said="Google: ${g:-none} / www ${gw:-none} · Cloudflare: ${c:-none} / www ${cw:-none}"
            [ "$said" = "$last" ] || { echo "$(now)  $said"; last=$said; }
            if pages_only "$g" && pages_only "$c" && pages_only "$gw" && pages_only "$cw"; then
              echo "WORLD=ok" >> "$GITHUB_ENV"; exit 0
            fi
            if late; then echo "The public DNS still gives the old answer."; exit 1; fi
            sleep 30
          done

      # Two clean rounds over the pages the app and the stores open: a new
      # certificate reaches GitHub's servers one by one, so a single good
      # answer can come from the one server that already has it.
      - name: GitHub's certificate
        if: always()
        run: |
          . "$RUNNER_TEMP/lib.sh"
          [ "$WORLD" = ok ] || { echo "Skipped: the DNS is not there."; exit 1; }
          err="$RUNNER_TEMP/curl.err"
          last=""; clean=0
          while :; do
            good=0; bad=""
            for path in / /privacy /app/ /cards/cards.json /widget/days.json /terms; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 "https://$DOMAIN$path" 2>"$err") || true
              if [ "$code" = 200 ]; then good=$((good + 1)); else bad="$path $code $(tail -1 "$err")"; fi
            done
            if [ "$good" = 6 ]; then clean=$((clean + 1)); else clean=0; fi
            said="https: $good/6 answer${bad:+ · last miss: $bad}"
            [ "$said" = "$last" ] || { echo "$(now)  $said"; last=$said; }
            if [ "$clean" -ge 2 ]; then echo "HTTPS=ok" >> "$GITHUB_ENV"; exit 0; fi
            if [ "$clean" = 0 ] && late; then echo "The certificate for $DOMAIN is not served everywhere yet."; exit 1; fi
            if [ "$clean" = 1 ]; then sleep 5; else sleep 30; fi
          done

      - name: What answers there
        if: always()
        run: |
          . "$RUNNER_TEMP/lib.sh"
          ns=$(dig +short NS "$DOMAIN" @1.1.1.1 | head -1)
          ns=${ns:-braelyn.ns.cloudflare.com.}
          a=$(addresses "$DOMAIN" "$ns")
          www=$(dig +short CNAME "www.$DOMAIN" @"$ns" | tr 'A-Z' 'a-z' | tr '\n' ' ' | sed 's/ $//')
          echo "== At $ns: A ${a:-none} · www CNAME ${www:-none} · www A $(addresses "www.$DOMAIN" "$ns")"
          err="$RUNNER_TEMP/curl.err"
          for path in / /privacy /terms /support /app/ /cards/cards.json /widget/days.json /assets/site.css /assets/og.png /sitemap.xml; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 "https://$DOMAIN$path" 2>"$err") || true
            echo "https://$DOMAIN$path  $code $(tail -1 "$err")"
          done
          http=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' -m 20 "http://$DOMAIN/" 2>/dev/null || true)
          echo "== http://$DOMAIN/ → $http"
          echo "== http://www.$DOMAIN/ → $(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' -m 20 "http://www.$DOMAIN/" 2>&1 || true)"
          echo "== The certificate, three times"
          for i in 1 2 3; do
            cert=$(echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null \
              | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | tr '\n' ' ' || true)
            echo "${cert:-none}"
          done
          echo "== What is left"
          missing=""
          for ip in $PAGES; do case " $a " in *" $ip "*) ;; *) missing="$missing $ip" ;; esac; done
          [ -z "$missing" ] || echo "- add A @ →$missing"
          if [ "$www" != "$CNAME." ]; then
            echo "- add CNAME www → $CNAME"
          else
            case "$cert" in *"DNS:www.$DOMAIN"*) ;; *) echo "- the certificate does not cover www yet: Check again on Pages" ;; esac
          fi
          case "$http" in 301\ https://*) ;; *) echo "- tick Enforce HTTPS" ;; esac
          echo "== Verdict: records=${RECORDS:-no} world=${WORLD:-no} https=${HTTPS:-no}"
          [ "$HTTPS" = ok ]

      # What a phone in Italy gets: Globalping's volunteer probes there ask
      # their own provider's DNS, then open the site over HTTPS.
      - name: From Italy
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          api = "https://api.globalping.io/v1/measurements"
          domain = os.environ["DOMAIN"]

          def start(body):
              req = urllib.request.Request(api, data=json.dumps(body).encode(),
                                           headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)["id"]

          def result(mid):
              for _ in range(30):
                  with urllib.request.urlopen(f"{api}/{mid}", timeout=30) as r:
                      m = json.load(r)
                  if m["status"] != "in-progress":
                      break
                  time.sleep(2)
              return m["results"]

          where = [{"country": "IT", "limit": 5}]
          try:
              dns = result(start({"type": "dns", "target": domain, "locations": where,
                                  "measurementOptions": {"query": {"type": "A"}}}))
              web = result(start({"type": "http", "target": domain, "locations": where,
                                  "measurementOptions": {"protocol": "HTTPS",
                                                         "request": {"method": "HEAD", "path": "/"}}}))
          except Exception as e:
              print("Globalping did not answer:", e)
              raise SystemExit(0)

          def probe(r):
              p = r["probe"]
              return f"{p.get('city')}, {p.get('network')}"

          print("== DNS from Italy, through each probe's own resolver")
          for r in dns:
              res = r["result"]
              said = " ".join(a.get("value", "") for a in res.get("answers") or [])
              print(f"{probe(r)}: {said or res.get('statusCodeName') or (res.get('rawOutput') or '')[:120]}")
          print("== HTTPS from Italy")
          for r in web:
              res = r["result"]
              tls = res.get("tls") or {}
              if res.get("statusCode"):
                  cert = "good" if tls.get("authorized") else f"refused: {tls.get('error')}"
                  cn = (tls.get("subject") or {}).get("CN", "")
                  print(f"{probe(r)}: {res['statusCode']} from {res.get('resolvedAddress')} · certificate {cert} {cn}")
              else:
                  print(f"{probe(r)}: {(res.get('rawOutput') or '')[:160]}")
          PY
