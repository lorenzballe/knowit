# The server's own checks: the functions' tests against the bundled bank,
# and the Firestore rules against the emulator. Neither needs a project or a
# secret. Deploying is a separate, deliberate step — see functions/README.md.
name: Cloud check

on:
  push:
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'tool/rules/**'
      - 'web/cards/cards.json'
      - 'lib/data/genres.dart'
      - '.github/workflows/cloud-check.yml'
  pull_request:
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'tool/rules/**'
      - 'web/cards/cards.json'
      - 'lib/data/genres.dart'
      - '.github/workflows/cloud-check.yml'
  workflow_dispatch:

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # No lockfile is kept for the rules' tooling (see .gitignore).
      - run: npm install
        working-directory: tool/rules
      - run: npm test
        working-directory: tool/rules
      # The scorecard's reads and writes (functions/src/scorecard.ts),
      # against the same emulator: a day counted once, reports turned into
      # a quarantine, no note in what the tools read.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
        working-directory: functions
      - run: npx firebase emulators:exec --only firestore --project astuto-scorecard-test "node --test ../../functions/lib/scorecard.emulator.test.js"
        working-directory: tool/rules
