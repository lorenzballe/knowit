name: Glass shots

# Photographs of the app on an iPhone simulator with the newest iOS, for
# what only iOS draws and no camera of the app's own can show: Apple's own
# Liquid Glass, the tab bar and the round back and close buttons. The app is
# walked by integration_test/glass_shots_test.dart, which says which screen
# is up with a line `SHOT <name>`; the screen is photographed every second
# and a half and each picture named by the last line said. The pictures are
# the run's artifact. Nothing is signed, uploaded or measured.

on:
  workflow_dispatch: {}

concurrency:
  group: glass-shots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The newest Xcode, for the iOS 26 SDK the glass compiles against and
      # the newest simulator.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: An iPhone on the newest iOS
        run: |
          pick() {
            xcrun simctl list -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          runtimes = [r for r in d["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable")]
          if not runtimes:
              sys.exit(1)
          rt = sorted(runtimes, key=lambda r: [int(x) for x in r["version"].split(".")])[-1]
          types = rt.get("supportedDeviceTypes") or d["devicetypes"]
          phones = [t for t in types if t["name"].startswith("iPhone") and "Pro" in t["name"] and "Max" not in t["name"]]
          print(rt["identifier"], phones[-1]["identifier"], rt["version"])
          '
          }
          if ! pick >/dev/null; then xcodebuild -downloadPlatform iOS; fi
          read RT DT VER < <(pick)
          echo "iOS $VER, $DT"
          UDID=$(xcrun simctl create shots "$DT" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 --cellularMode active
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Walk the app and photograph it
        run: |
          mkdir -p shots
          # Through a terminal of its own (script -F flushes each write), so a
          # SHOT line is in walk.log the moment it is said: written to a plain
          # file, the output came all at once at the end of each test, and every
          # picture was named by the last screen of the test before.
          script -q -F walk.log flutter test integration_test/glass_shots_test.dart -d "$UDID" > /dev/null 2>&1 &
          PID=$!
          i=0
          while kill -0 "$PID" 2>/dev/null; do
            NAME=$(grep -o 'SHOT [a-z0-9-]*' walk.log 2>/dev/null | tail -1 | cut -d' ' -f2 || true)
            if [ -n "$NAME" ]; then
              xcrun simctl io "$UDID" screenshot "shots/$(printf %04d $i)-$NAME.png" >/dev/null 2>&1 || true
              i=$((i+1))
            fi
            sleep 1.5
          done
          set +e
          wait "$PID"
          STATUS=$?
          tail -60 walk.log
          # The last two pictures of each screen, the most settled.
          python3 - <<'EOF'
          import collections, os, re
          by = collections.defaultdict(list)
          for f in sorted(os.listdir('shots')):
              m = re.match(r'\d+-(.+)\.png$', f)
              if m:
                  by[m.group(1)].append(f)
          for name, files in by.items():
              for f in files[:-2]:
                  os.remove(os.path.join('shots', f))
          print({k: len(v) for k, v in by.items()})
          EOF
          exit $STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-shots
          path: |
            shots/
            walk.log
