# Deploys the server: the functions, the Firestore rules and the indexes.
#
# Run by hand from the Actions tab, never on a push: a deploy changes what
# every phone is dealt from tomorrow, and it should be a decision. It needs
# one secret, FIREBASE_SERVICE_ACCOUNT: the JSON key of a service account
# on the project with the roles Cloud Functions Admin, Firebase Rules Admin,
# Cloud Scheduler Admin, Service Account User and Artifact Registry Writer
# (Firebase console → Project settings → Service accounts → Generate new
# private key gives one with enough, as the project's default account).
#
# The answers to Astute+ readers' questions (askCard, functions/src/ask.ts)
# are asked of Claude with ANTHROPIC_API_KEY, the same Actions secret the
# card factory uses: each deploy keeps it in Secret Manager, where the
# function reads it, so the service account needs Secret Manager Admin too.
name: Cloud deploy

on:
  workflow_dispatch:
    inputs:
      only:
        description: What to deploy
        default: functions,firestore:rules,firestore:indexes
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - name: Deploy
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$KEY" || { echo "FIREBASE_SERVICE_ACCOUNT is not set"; exit 1; }
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # The key askCard asks Claude with, kept in Secret Manager before the
          # functions that read it are deployed. Without it the deploy stops
          # here, saying why, rather than halfway through.
          case "${{ inputs.only }}" in *functions*)
            test -n "$ANTHROPIC" || { echo "ANTHROPIC_API_KEY is not set: add it under Settings → Secrets and variables → Actions"; exit 1; }
            # Only a key the API takes is kept: one it turns away (revoked,
            # mistyped, an account out of credit) would be kept all the same,
            # and every answer by Claude would fail. One question of one
            # token says which; turned away, the key the functions already
            # have stays, and the summary says what to do.
            reply="$(curl -s -w '\n%{http_code}' https://api.anthropic.com/v1/messages \
              -H "x-api-key: $ANTHROPIC" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' \
              -d '{"model":"claude-haiku-5-5","max_tokens":1,"messages":[{"role":"user","content":"ok"}]}' || true)"
            code="$(printf '%s' "$reply" | tail -n 1)"
            if [ "$code" = "200" ]; then
              echo "The Anthropic API takes the key."
              umask 077
              printf '%s' "$ANTHROPIC" > "$RUNNER_TEMP/ak"
              npx --yes firebase-tools@15 functions:secrets:set ANTHROPIC_API_KEY --data-file "$RUNNER_TEMP/ak" --project astuto-3d398 --non-interactive --force
              rm -f "$RUNNER_TEMP/ak"
            else
              why="$(printf '%s' "$reply" | sed '$d' | python3 -c 'import sys, json; print(json.load(sys.stdin).get("error", {}).get("message", ""))' 2>/dev/null || true)"
              echo "::warning::The Anthropic API turned the ANTHROPIC_API_KEY secret away (HTTP $code: $why). The key the functions already have is kept."
              {
                echo "### The Anthropic API turned the key away (HTTP $code)"
                echo
                echo "$why"
                echo
                echo "Make a new key at console.anthropic.com → API keys, and put it in GitHub under Settings → Environments → production → ANTHROPIC_API_KEY, then deploy again. Until then the functions keep the key they have."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          ;; esac
          npx --yes firebase-tools@15 deploy --only "${{ inputs.only }}" --project astuto-3d398 --non-interactive --force
