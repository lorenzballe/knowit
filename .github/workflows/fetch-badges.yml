name: Fetch store badges (one-off)

# Downloads the official App Store and Google Play badges into
# site/assets/badges and commits them. Removed once they are in.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-badges.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the badges
        run: |
          mkdir -p site/assets/badges
          cd site/assets/badges
          # The first address that answers with the right kind of file wins.
          get() {
            out=$1; kind=$2; shift 2
            for u in "$@"; do
              if curl -sSfL -A "Mozilla/5.0 (astutetheapp.com badge fetch)" -o "$out" "$u" && grep -qa "$kind" "$out"; then
                echo "$out ← $u ($(wc -c < "$out") bytes)"; return 0
              fi
              echo "  not from $u"; rm -f "$out"
            done
          }
          get app-store.svg "<svg" \
            "https://toolbox.marketingtools.apple.com/api/v2/badges/download-on-the-app-store/black/en-us?size=250x83" \
            "https://toolbox.marketingtools.apple.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" \
            "https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" \
            "https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg"
          get google-play.png "PNG" \
            "https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
          get google-play.svg "<svg" \
            "https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
          ls -la

      - name: Commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/badges
          git commit -m "Official App Store and Google Play badges for the site" || exit 0
          git push
