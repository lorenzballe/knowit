name: Fetch store badges (one-off)

# Downloads the official App Store and Google Play badges and prints them
# into the log, for the site. Removed again once they are in site/assets.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-badges.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSfL -o apple.svg "https://tools.applemarketingtools.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" || true
          curl -sSfL -o play.png "https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" || true
          curl -sSfL -A "Mozilla/5.0 (badge fetch for astutetheapp.com)" -o play.svg "https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" || true
          for f in apple.svg play.png play.svg; do
            [ -s "$f" ] || { echo "== missing $f"; continue; }
            echo "== begin $f $(wc -c < "$f") $(sha256sum "$f" | cut -c1-16)"
            base64 -w 0 "$f" | fold -w 3000
            echo
            echo "== end $f"
          done
