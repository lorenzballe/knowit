<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- slug: science-graphene-sticky-tape -->
<!-- Look: a thermal-camera view of a graphite flake. Its layers glow in a false-colour heat ramp, a scan line sweeps the frame, and HUD brackets and a heat scale with a live marker frame the shot.
     Interaction: pull the glowing strip of tape up. The top half of the flake lifts and tilts, sticky strands stretch, and then it snaps off in a burst of flakes. A d3 chart logs the layers left after each peel.
     Wow: the last peel leaves one white-hot layer. The camera zooms into a glowing, twinkling honeycomb, and the chart morphs from a linear to a log scale. -->
<title>Graphene was found with sticky tape</title>
<link rel="stylesheet" href="kit/fonts.css">
<link rel="stylesheet" href="kit/astute-card.css">
<script src="kit/vendor/gsap.min.js"></script>
<script src="kit/vendor/d3.min.js"></script>
<style>
#stage{display:flex;flex:1;min-height:0}
#pic{flex:1;min-width:0;width:100%;height:100%;display:block;touch-action:none;cursor:ns-resize}
.say{overflow-wrap:anywhere}
.hint{animation:nudge 1.3s cubic-bezier(.5,0,.5,1) infinite}
@keyframes nudge{50%{transform:translateY(-5px)}}
.kit-calm .hint{animation:none}
.blink{animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
</style>
<article class="card" id="card" data-topic="science" data-kind="Pull the tape · peel the flake" style="--c:#0b0718;--k:#f1ecff;--edge:#030208">
  <div class="in">
    <div class="label"><svg></svg><span class="t"></span><span class="tag">PEEL IT</span></div>
    <h2 class="q">How was graphene first discovered?</h2>
    <div class="stagebox" id="stage">
      <svg id="pic" role="img" aria-label="A thermal camera view of a graphite flake made of stacked layers, with a strip of sticky tape on top, and a chart of the layers left after each peel."></svg>
    </div>
    <p class="say" id="say"><b>Pull the tape up</b> to peel the graphite flake. Then do it again.</p>
    <div class="keep gone" id="keep"><b>WHAT TO KEEP</b>The "material of the future" was first peeled off with the tape you have at home.</div>
    <div class="foot"><span class="src">Source · Geopop, “GRAFENE: il materiale del futuro” (YouTube, 2019)</span></div>
  </div>
</article>
<script src="kit/astute-card.js"></script>
<script>
(() => {
  const svg = Kit.$('pic'), say = Kit.$('say');
  const TOTAL = 32, PEELS = 5;
  let n = TOTAL, step = 0, done = false, busy = false, touched = false, pending = null;
  let W = 0, H = 0, fs = 12, sx = 0, sw = 0, base = 0, lh = 4, th = 20, hudH = 50, chartTop = 0, chartBot = 0, thr = 40, compact = false;
  let scanTween = null, mode = 'lin';
  const G = {}, lift = {y: 0};
  const RAMP = ['#fff7d6', '#ffd23f', '#ff7a1a', '#e0245e', '#7a1fa2', '#2a0b5c'];
  const ramp = d3.interpolateRgbBasis(RAMP);
  const heat = i => ramp(Math.max(0, Math.min(1, i / (TOTAL - 1))));
  const jit = []; for (let i = 0; i < TOTAL; i++) jit.push([Kit.rnd(), Kit.rnd()]);
  const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono') || 'monospace';
  const txt = (p, x, y, t, a = {}) => { const e = Kit.mk('text', Object.assign({x, y, fill: '#e9e4ff', 'font-family': MONO, 'font-size': fs, 'font-weight': 700, 'letter-spacing': '.04em'}, a), p); e.textContent = t; return e; };
  const kill = k => { if (G[k]) { G[k].kill(); G[k] = null; } };

  function layout() {
    const p = pending; pending = null;
    if (scanTween) scanTween.kill();
    kill('tl'); kill('tw'); kill('breath');
    gsap.killTweensOf(lift);
    svg.innerHTML = '';
    const f = Kit.fitSvg(svg); W = f.W; H = f.H;
    fs = Math.max(12, Math.min(14, (f.f || 13) * .9, W / 26));
    compact = H < 300;
    hudH = compact ? fs * 2.5 : fs * 4.4;
    const chartH = compact ? Math.max(fs * 4.8, H * .3) : Math.max(H * .23, fs * 6.4);
    chartTop = H - chartH; chartBot = H - fs * 1.9;
    base = chartTop - fs * 2.3;
    sx = W * .15; sw = W * .64;
    th = fs * 1.8;
    const avail = base - hudH - th - fs * 2.1;
    lh = Math.max(1.4, Math.min(8, avail / TOTAL));
    thr = fs * 3;

    // ---- defs ----
    const defs = Kit.mk('defs', {}, svg);
    const sc = Kit.mk('linearGradient', {id: 'scan', x1: 0, x2: 0, y1: 0, y2: 1}, defs);
    [['0', 0], ['.7', .1], ['.96', .45], ['1', 0]].forEach(([o, a]) => Kit.mk('stop', {offset: o, 'stop-color': '#9ff8ff', 'stop-opacity': a}, sc));
    const tp = Kit.mk('linearGradient', {id: 'tape', x1: 0, x2: 0, y1: 0, y2: 1}, defs);
    Kit.mk('stop', {offset: '0', 'stop-color': '#c4fbff', 'stop-opacity': .95}, tp); Kit.mk('stop', {offset: '.5', 'stop-color': '#7ff0ff', 'stop-opacity': .9}, tp); Kit.mk('stop', {offset: '1', 'stop-color': '#3cc4dd', 'stop-opacity': .85}, tp);
    const hs = Kit.mk('linearGradient', {id: 'hs', x1: 0, x2: 0, y1: 0, y2: 1}, defs);
    RAMP.forEach((c, i) => Kit.mk('stop', {offset: i / (RAMP.length - 1), 'stop-color': c}, hs));
    const band = Kit.mk('linearGradient', {id: 'band', x1: 0, x2: 1, y1: 0, y2: 0}, defs);
    [['0', '#e0245e', 0], ['.25', '#ff7a1a', .35], ['.5', '#fff7d6', .45], ['.75', '#ff7a1a', .35], ['1', '#e0245e', 0]].forEach(([o, c, a]) => Kit.mk('stop', {offset: o, 'stop-color': c, 'stop-opacity': a}, band));
    const gl = Kit.mk('filter', {id: 'glow', x: '-30%', y: '-30%', width: '160%', height: '160%'}, defs);
    Kit.mk('feGaussianBlur', {stdDeviation: Math.max(2, fs * .25), result: 'b'}, gl);
    const fm = Kit.mk('feMerge', {}, gl); Kit.mk('feMergeNode', {in: 'b'}, fm); Kit.mk('feMergeNode', {in: 'SourceGraphic'}, fm);
    const bl = Kit.mk('filter', {id: 'blur', x: '-50%', y: '-50%', width: '200%', height: '200%'}, defs);
    Kit.mk('feGaussianBlur', {stdDeviation: fs * 1.2}, bl);
    const cp = Kit.mk('clipPath', {id: 'hexclip'}, defs);
    G.clip = Kit.mk('rect', {x: sx, y: base - lh, width: sw, height: lh}, cp);

    // ---- the scene sits directly on the card's ground (no backdrop) ----
    const grid = Kit.mk('g', {stroke: '#8f7bff', 'stroke-opacity': .07, 'stroke-width': 1}, svg);
    for (let x = fs * 2; x < W; x += fs * 2.2) Kit.mk('line', {x1: x, x2: x, y1: 0, y2: H}, grid);
    for (let y = fs * 2; y < H; y += fs * 2.2) Kit.mk('line', {x1: 0, x2: W, y1: y, y2: y}, grid);
    // HUD brackets
    const m = fs * .6, L = fs * 1.4, by = chartTop - fs * .6, br = Kit.mk('g', {stroke: '#bfb4ff', 'stroke-opacity': .55, 'stroke-width': 1.6, fill: 'none'}, svg);
    [[m, m, 1, 1], [W - m, m, -1, 1], [m, by, 1, -1], [W - m, by, -1, -1]].forEach(([x, y, a, b]) => Kit.mk('path', {d: `M${x},${y + b * L} V${y} H${x + a * L}`}, br));
    // HUD text
    const lx = fs * 1.3;
    if (compact) {
      Kit.mk('circle', {cx: lx, cy: fs * 1.75 - fs * .34, r: fs * .26, fill: '#ff3b5c', class: 'blink'}, svg);
      G.left = txt(svg, lx + fs * .65, fs * 1.75, 'IR · MANCHESTER 2004', {fill: '#bfb4ff', 'font-weight': 600});
      G.hudL = txt(svg, W - lx, fs * 1.75, '', {'text-anchor': 'end', fill: '#fff3c4'});
      G.hudP = null;
    } else {
      G.left = txt(svg, lx, fs * 2.2, 'IR · MANCHESTER 2004', {fill: '#bfb4ff', 'font-weight': 600});
      Kit.mk('circle', {cx: lx + fs * .28, cy: fs * 3.3, r: fs * .28, fill: '#ff3b5c', class: 'blink'}, svg);
      txt(svg, lx + fs * .9, fs * 3.65, 'REC', {fill: '#ff8fa3', 'font-weight': 600});
      G.hudL = txt(svg, W - lx, fs * 2.2, '', {'text-anchor': 'end', fill: '#fff3c4'});
      G.hudP = txt(svg, W - lx, fs * 3.65, '', {'text-anchor': 'end', fill: '#bfb4ff', 'font-weight': 600});
    }
    // heat scale bar with a live marker
    G.hy0 = hudH + fs * .3; G.hy1 = base - fs * .3; G.mark = null;
    if (G.hy1 - G.hy0 > fs * 2) {
      const bx = W - fs * 1.5;
      Kit.mk('rect', {x: bx, y: G.hy0, width: fs * .45, height: G.hy1 - G.hy0, rx: fs * .2, fill: 'url(#hs)', opacity: .9}, svg);
      G.mark = Kit.mk('path', {d: `M${bx - 3},0 l-${fs * .55},-${fs * .32} v${fs * .64}z`, fill: '#fff3c4', filter: 'url(#glow)'}, svg);
      gsap.set(G.mark, {y: markY()});
    }

    // ---- the flake ----
    G.aura = Kit.mk('ellipse', {cx: sx + sw / 2, cy: base - TOTAL * lh * .3, rx: sw * .55, ry: Math.max(fs, TOTAL * lh * .45), fill: '#ff7a1a', opacity: .18, filter: 'url(#blur)'}, svg);
    if (!Kit.calm) G.breath = gsap.to(G.aura, {attr: {rx: sw * .62}, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: -1});
    Kit.mk('line', {x1: sx - sw * .06, x2: sx + sw * 1.06, y1: base + 1.5, y2: base + 1.5, stroke: '#5a4a8a', 'stroke-width': 1.5}, svg);
    G.stack = Kit.mk('g', {}, svg);
    G.fx = Kit.mk('g', {'pointer-events': 'none'}, svg);
    G.hex = Kit.mk('g', {opacity: 0}, svg);
    G.hexLabel = Kit.mk('g', {opacity: 0}, svg);

    // ---- chart ----
    G.chart = Kit.mk('g', {}, svg);
    Kit.mk('line', {x1: fs * .9, x2: W - fs * .9, y1: chartTop - fs * .1, y2: chartTop - fs * .1, stroke: '#3a2e60', 'stroke-width': 1}, G.chart);
    G.cap = txt(G.chart, fs * .9, H - fs * .55, '', {fill: '#bfb4ff', 'font-weight': 600});
    G.bars = d3.select(Kit.mk('g', {}, G.chart));

    // ---- scan line ----
    const bh = H * .14;
    G.scan = Kit.mk('rect', {x: 0, y: -bh, width: W, height: bh, fill: 'url(#scan)', 'pointer-events': 'none'}, svg);
    G.flash = Kit.mk('rect', {width: W, height: H, fill: '#fff7d6', opacity: 0, 'pointer-events': 'none'}, svg);
    if (!Kit.calm) scanTween = gsap.fromTo(G.scan, {attr: {y: -bh}}, {attr: {y: H}, duration: 2.8, ease: 'sine.inOut', repeat: -1, repeatDelay: .25});
    else G.scan.setAttribute('y', chartTop - bh);

    buildStack(); hud(); drawChart(0);
    if (done) showHex(true);
    if (p) p();
  }

  const markY = () => G.hy0 + ((n - 1) / (TOTAL - 1)) * (G.hy1 - G.hy0);

  function buildStack() {
    G.stack.innerHTML = ''; G.tape = null; G.strands = []; G.snap = false;
    const half = n / 2; G.crackY = base - half * lh;
    const low = Kit.mk('g', {}, G.stack), strands = Kit.mk('g', {}, G.stack), top = Kit.mk('g', {}, G.stack);
    G.top = top;
    const gap = lh > 4 ? 1 : lh > 2 ? .5 : .25;
    for (let i = 0; i < n; i++) {
      const [a, b] = jit[i], w = sw * (.9 + .1 * a), x = sx + (sw - w) * b;
      const p = i >= half && n > 1 ? top : low;
      Kit.mk('rect', {class: 'layer', x, y: base - (i + 1) * lh, width: w, height: Math.max(.8, lh - gap), rx: Math.min(2, lh / 3), fill: heat(i)}, p);
      if (lh > 4) Kit.mk('rect', {x: x + 2, y: base - (i + 1) * lh, width: w - 4, height: .8, fill: '#fff', opacity: .25}, p);
    }
    G.aura.setAttribute('ry', Math.max(fs, n * lh * .45));
    G.aura.setAttribute('cy', base - n * lh * .4);
    G.aura.setAttribute('fill', heat(n - 1));
    if (n > 1) for (let k = 0; k < 7; k++) {
      const x = sx + sw * (.07 + .86 * k / 6) + (jit[k][0] - .5) * fs;
      G.strands.push([Kit.mk('line', {x1: x, x2: x, y1: G.crackY, y2: G.crackY, stroke: '#9ff8ff', 'stroke-width': 1.1, 'stroke-linecap': 'round', opacity: 0}, strands), x]);
    }
    G.crack = Kit.mk('line', {x1: sx, x2: sx + sw, y1: G.crackY, y2: G.crackY, stroke: '#9ff8ff', 'stroke-width': 2, filter: 'url(#glow)', opacity: 0}, G.stack);
    if (n > 1 && !done) {
      const tg = Kit.mk('g', {}, top); G.tape = tg;
      const ty = base - n * lh - th - 1, tx = sx - sw * .04, tw = sw * 1.08;
      Kit.mk('rect', {x: tx, y: ty, width: tw, height: th, rx: 3, fill: '#7ff6ff', opacity: .35, filter: 'url(#glow)'}, tg);
      Kit.mk('rect', {x: tx, y: ty, width: tw, height: th, rx: 3, fill: 'url(#tape)', stroke: '#e6feff', 'stroke-width': 1.2}, tg);
      for (let x = tx + 6; x < tx + tw - 6; x += 7) Kit.mk('line', {x1: x, x2: x + 3, y1: ty + 3, y2: ty + th - 3, stroke: '#ffffff', 'stroke-opacity': .22, 'stroke-width': 1}, tg);
      Kit.mk('rect', {x: tx + 3, y: ty + 2, width: tw - 6, height: Math.max(1, th * .12), rx: 1, fill: '#fff', opacity: .55}, tg);
      // the curled free end of the tape
      const ex = tx + tw;
      Kit.mk('path', {d: `M${ex - fs * .2},${ty} Q${ex + fs * .7},${ty - fs * .1} ${ex + fs * .95},${ty - fs * .85} Q${ex + fs * .3},${ty + th * .3} ${ex},${ty + th * .7}Z`, fill: '#e6feff', opacity: .9, stroke: '#9ff8ff', 'stroke-width': 1}, tg);
      txt(tg, tx + tw / 2, ty + th / 2 + fs * .36, 'PULL ↑', {'text-anchor': 'middle', fill: '#062029', 'font-weight': 800, 'letter-spacing': '.14em'});
      if (!touched) {
        const cx = tx + tw / 2, hg = Kit.mk('g', {class: 'hint'}, tg);
        Kit.mk('path', {d: `M${cx},${ty - 4} v-${fs * 1.3} m-6,7 l6,-7 l6,7`, stroke: '#9ff8ff', 'stroke-width': 2.2, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', filter: 'url(#glow)'}, hg);
      }
    }
    render();
  }

  function render() {
    if (!G.top) return;
    const a = Math.min(lift.y * .05, 8), rad = a * Math.PI / 180;
    G.top.setAttribute('transform', `translate(0,${-lift.y}) rotate(${-a} ${sx} ${G.crackY})`);
    if (G.crack) G.crack.setAttribute('opacity', Math.min(1, lift.y / thr));
    G.strands.forEach(([el, x]) => {
      const dx = x - sx, x2 = sx + dx * Math.cos(rad), y2 = G.crackY - dx * Math.sin(rad) - lift.y;
      el.setAttribute('x2', x2); el.setAttribute('y2', y2);
      el.setAttribute('opacity', G.snap || lift.y < 1 ? 0 : Math.max(.15, .85 - lift.y / (thr * 3)));
    });
  }

  function hud() {
    if (!G.hudL) return;
    if (compact) G.hudL.textContent = `LAYERS ${n} · ${step}/${PEELS}`;
    else { G.hudL.textContent = `LAYERS ${n}`; G.hudP.textContent = `PEELS ${step}/${PEELS}`; }
    G.cap.textContent = mode === 'log' ? 'EACH PEEL: SAME STEP DOWN' : 'LAYERS LEFT AFTER EACH PEEL';
    G.left.textContent = 'IR · MANCHESTER 2004';
    try { const a = G.left.getBBox(), b = G.hudL.getBBox(); if (b.width && a.x + a.width + fs * .8 > b.x) G.left.textContent = 'IR · 2004'; } catch (e) {}
    if (G.mark) { if (Kit.calm) gsap.set(G.mark, {y: markY()}); else gsap.to(G.mark, {y: markY(), duration: .7, ease: 'back.out(1.6)'}); }
  }

  function drawChart(dur) {
    const x = d3.scaleBand().domain(d3.range(PEELS + 1)).range([fs * .9, W - fs * .9]).padding(.3);
    const y0 = chartBot, y1 = Math.min(chartTop + fs * 1.6, y0 - 6);
    const ys = mode === 'log' ? d3.scaleLog().base(2).domain([.5, TOTAL]).range([y0, y1]) : d3.scaleLinear().domain([0, TOTAL]).range([y0, y1]);
    const data = d3.range(PEELS + 1).map(i => ({i, v: TOTAL / 2 ** i, on: i <= step}));
    const hy = d => d.on ? Math.min(y0 - 1.5, ys(d.v)) : y0, hh = d => d.on ? Math.max(1.5, y0 - ys(d.v)) : 0;
    const col = v => ramp(Math.min(1, (v - 1) / (TOTAL - 1)) * .86);
    G.bars.selectAll('rect.slot').data(data).join('rect').attr('class', 'slot')
      .attr('x', d => x(d.i)).attr('width', x.bandwidth()).attr('y', y0).attr('height', 2).attr('fill', '#3a2e60');
    const r = G.bars.selectAll('rect.bar').data(data).join(e => e.append('rect').attr('class', 'bar').attr('y', y0).attr('height', 0))
      .attr('x', d => x(d.i)).attr('width', x.bandwidth()).attr('rx', 2).attr('fill', d => col(d.v))
      .attr('stroke', '#ffffff').attr('stroke-opacity', .12).attr('filter', d => d.v === 1 && d.on ? 'url(#glow)' : null);
    const t = G.bars.selectAll('text.val').data(data).join(e => e.append('text').attr('class', 'val').attr('y', y0 - 4))
      .attr('x', d => x(d.i) + x.bandwidth() / 2).attr('text-anchor', 'middle').attr('font-family', MONO).attr('font-size', fs).attr('font-weight', 700)
      .attr('fill', '#fff3c4').text(d => d.v).attr('opacity', d => d.on ? 1 : 0);
    if (dur) {
      r.transition().duration(dur).ease(d3.easeBackOut.overshoot(1.4)).attr('y', hy).attr('height', hh);
      t.transition().duration(dur).ease(d3.easeBackOut.overshoot(1.4)).attr('y', d => hy(d) - 4);
    } else { r.attr('y', hy).attr('height', hh); t.attr('y', d => hy(d) - 4); }
  }

  function sayStep() {
    const msg = {
      1: 'The tape tears part of the flake away. What stays behind is <b>thinner</b>. Peel again.',
      2: 'Again. Each strip of tape leaves a thinner flake. <b>Keep peeling.</b>',
      3: 'Thinner and thinner. That was the whole experiment: tape, again and again. <b>Keep going.</b>',
      4: 'Almost there. <b>One more peel.</b>'
    }[step];
    if (msg) say.innerHTML = msg;
  }

  // flakes of graphite torn loose at the snap
  function debris() {
    if (Kit.calm) return;
    const half = n / 2;
    for (let k = 0; k < 16; k++) {
      const r = Math.random, w = fs * (.3 + .6 * r());
      const el = Kit.mk('rect', {x: sx + r() * sw, y: G.crackY - lift.y * .5, width: w, height: Math.max(1.2, lh * .8), rx: .6, fill: heat(half + r() * half * .9)}, G.fx);
      gsap.to(el, {x: (r() - .5) * fs * 4, y: (r() - .25) * fs * 3.5, rotation: (r() - .5) * 220, transformOrigin: '50% 50%', opacity: 0, duration: .7 + r() * .5, ease: 'power2.out', onComplete: () => el.remove()});
    }
  }

  // ---- the honeycomb: one single layer ----
  function showHex(instant) {
    kill('tl'); kill('tw');
    G.hex.innerHTML = ''; G.hexLabel.innerHTML = '';
    const bh = Math.max(fs * 1.5, Math.min(base - hudH - fs * .5, sw * .55)), top = base - bh, cy = top + bh / 2;
    const r = Math.max(fs * .9, bh / 4.2), hw = Math.sqrt(3) * r;
    const inner = Kit.mk('g', {'clip-path': 'url(#hexclip)'}, G.hex);
    Kit.mk('rect', {x: sx, y: top, width: sw, height: bh, fill: 'url(#band)'}, inner);
    const hexes = [], atoms = [];
    for (let row = -1, yy = top - r; yy < base + r * 2; row++, yy += r * 1.5) {
      for (let xx = sx - hw + (row & 1 ? hw / 2 : 0); xx < sx + sw + hw; xx += hw) {
        let d = '';
        const dist = Math.hypot(xx - (sx + sw / 2), yy - cy);
        for (let k = 0; k < 6; k++) { const ang = Math.PI / 180 * (60 * k - 30), px = xx + r * Math.cos(ang), py = yy + r * Math.sin(ang); d += (k ? 'L' : 'M') + px.toFixed(1) + ',' + py.toFixed(1); if (k < 2) atoms.push([px, py, dist]); }
        hexes.push([Kit.mk('path', {d: d + 'Z', fill: 'none', stroke: '#fff3c4', 'stroke-width': 1.6, filter: 'url(#glow)', 'stroke-linejoin': 'round'}, inner), dist]);
      }
    }
    const dots = atoms.map(([x, y, d]) => [Kit.mk('circle', {cx: x, cy: y, r: Math.max(2, r * .13), fill: '#ffffff'}, inner), d]);
    Kit.mk('rect', {x: sx, y: top, width: sw, height: bh, fill: 'none', stroke: '#9ff8ff', 'stroke-opacity': .6, 'stroke-width': 1.2, 'stroke-dasharray': '4 4'}, G.hex);
    txt(G.hexLabel, sx + sw / 2, base + fs * 1.5, 'ONE LAYER = GRAPHENE', {'text-anchor': 'middle', fill: '#fff7d6', filter: 'url(#glow)'});
    G.hex.setAttribute('opacity', 1);
    const dotEls = dots.map(e => e[0]);
    const twinkle = delay => { if (!Kit.calm) G.tw = gsap.to(dotEls, {opacity: .3, duration: 1.1, ease: 'sine.inOut', delay, stagger: {each: .045, from: 'random', repeat: -1, yoyo: true}}); };
    if (instant || Kit.calm) {
      G.clip.setAttribute('y', top); G.clip.setAttribute('height', bh);
      G.hexLabel.setAttribute('opacity', 1); G.stack.setAttribute('opacity', 0);
      G.aura.setAttribute('opacity', .3); G.aura.setAttribute('ry', bh * .6); G.aura.setAttribute('cy', cy);
      twinkle(0);
      return;
    }
    const sorted = hexes.concat(dots).sort((a, b) => a[1] - b[1]).map(e => e[0]);
    G.tl = gsap.timeline({onComplete: () => twinkle(0)});
    G.tl.to(G.flash, {attr: {opacity: .55}, duration: .08, ease: 'power2.out'})
      .to(G.flash, {attr: {opacity: 0}, duration: .7, ease: 'expo.out'})
      .to(G.stack, {opacity: 0, duration: .4, ease: 'power2.out'}, '<')
      .fromTo(G.clip, {attr: {y: base - lh, height: lh}}, {attr: {y: top, height: bh}, duration: 1.1, ease: 'expo.inOut'}, '<')
      .from(sorted, {opacity: 0, scale: .2, transformOrigin: '50% 50%', duration: .5, ease: 'back.out(2)', stagger: {each: .6 / sorted.length}}, '<.25')
      .to(G.aura, {attr: {opacity: .32, ry: bh * .6, cy}, duration: 1, ease: 'power3.out'}, '<')
      .to(G.hexLabel, {opacity: 1, duration: .5, ease: 'power2.out'}, '-=.4');
  }

  function reveal() {
    done = true; Kit.haptic('success');
    hud(); showHex(false);
    setTimeout(() => { mode = 'log'; hud(); drawChart(Kit.calm ? 0 : 1100); }, Kit.calm ? 0 : 900);
    say.innerHTML = '2004, University of Manchester: Andre Geim and Konstantin Novoselov peeled graphite with ordinary sticky tape until a single layer was left: <b>graphene</b>.';
    Kit.show('keep');
  }

  function finish() {
    return new Promise(res => {
      busy = true; Kit.haptic('light');
      const end = () => {
        pending = null;
        n = Math.max(1, n / 2); step++; lift.y = 0;
        buildStack(); hud(); drawChart(Kit.calm ? 0 : 650);
        busy = false;
        if (n === 1) reveal();
        else { sayStep(); if (!Kit.calm && G.tape) gsap.from(G.tape, {y: -H * .25, opacity: 0, duration: .65, ease: 'back.out(1.5)'}); }
        res();
      };
      if (Kit.calm) { end(); return; }
      pending = end;
      G.snap = true; render(); debris();
      gsap.to(lift, {y: H * 1.1, duration: .55, ease: 'power3.in', onUpdate: render, onComplete: end});
      gsap.to(G.top, {opacity: 0, duration: .5, ease: 'power2.in'});
    });
  }
  const hideHint = () => { const h = svg.querySelector('.hint'); if (h) gsap.to(h, {opacity: 0, duration: .2}); };
  function peelAuto() {
    if (busy || done) return Promise.resolve();
    if (!touched) { touched = true; hideHint(); }
    busy = true;
    if (Kit.calm) return finish();
    return new Promise(res => {
      const go = () => { pending = null; finish().then(res); };
      pending = go;
      gsap.to(lift, {y: thr * 1.15, duration: .35, ease: 'power2.out', onUpdate: render, onComplete: go});
    });
  }

  // ---- the drag ----
  let drag = false, y0 = 0, moved = 0;
  svg.addEventListener('pointerdown', e => {
    if (busy || done) return;
    drag = true; y0 = e.clientY; moved = 0; svg.setPointerCapture(e.pointerId);
    if (!touched) { touched = true; hideHint(); }
    gsap.killTweensOf(lift); Kit.haptic('selection');
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = Math.max(0, y0 - e.clientY); moved = Math.max(moved, Math.abs(y0 - e.clientY));
    lift.y = dy < thr ? dy : thr + (dy - thr) * .55;
    render();
  });
  const up = () => {
    if (!drag) return; drag = false;
    if (lift.y > thr) finish();
    else if (moved < 6) peelAuto();
    else gsap.to(lift, {y: 0, duration: .7, ease: 'elastic.out(1,.45)', onUpdate: render});
  };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);

  new ResizeObserver(() => { if (W) layout(); }).observe(Kit.$('stage'));
  Kit.onShow.card = layout;
  Kit.onEnter.card = () => {
    if (Kit.calm) return;
    const layers = svg.querySelectorAll('.layer');
    gsap.from(layers, {opacity: 0, x: -W * .08, duration: .5, ease: 'power3.out', stagger: {each: .022, from: 'start'}});
    if (G.tape) gsap.from(G.tape, {y: -H * .3, opacity: 0, duration: .8, delay: .75, ease: 'back.out(1.6)'});
    gsap.from(G.aura, {opacity: 0, duration: 1.2, ease: 'power2.out'});
  };
  Kit.play.card = async () => {
    const wait = ms => new Promise(r => setTimeout(r, ms));
    for (let i = 0; i < PEELS; i++) { await peelAuto(); await wait(Kit.calm ? 30 : 150); }
    await wait(Kit.calm ? 60 : 2200);
  };
})();
Kit.single();
</script>
</html>
